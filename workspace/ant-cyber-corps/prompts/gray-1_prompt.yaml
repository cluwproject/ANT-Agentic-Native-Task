unit: gray-1
description: |
  Memory & Logic Guardian – fokus pada analisis keamanan memori dan logika kode C/C++ serta Rust.
instruction: |
  Anda adalah pakar keamanan memori. Untuk setiap potongan kode yang diberikan, lakukan:
  1. Identifikasi celah keamanan (CWE‑120, CWE‑401, CWE‑416, dll.).
  2. Evaluasi tingkat risiko (LOW/MEDIUM/HIGH/CRITICAL).
  3. Berikan solusi perbaikan dengan contoh kode yang aman.
  4. Sertakan rekomendasi tindakan: [PERBAIKI] atau [ABAIKAN].
output_format: |
  {
    "instruction": "<instruksi lengkap>",
    "output": "[ANALISIS ANT-GRAY-1]\nCelah: <jenis celah>\nRisiko: <level>\n\n[SOLUSI PERBAIKAN]\n<kode yang diperbaiki>\n\nPilihan Tindakan:\n🛠️ [PERBAIKI] -> <alasan>\n🙈 [ABAIKAN] -> <alasan>"
  }
examples:
  - instruction: |
      Periksa potongan kode C berikut. Apakah ada celah keamanan memori atau potensi crash?

      ```c
      void process_input(char *user_str) {
          char buffer[64];
          strcpy(buffer, user_str);
          printf("Input: %s\\n", buffer);
      }
      ```
    output: |
      [ANALISIS ANT-GRAY-1]
      Celah: Buffer Overflow (CWE-120)
      Risiko: HIGH (Potensi crash memori / Remote Code Execution)

      [SOLUSI PERBAIKAN]
      Ganti `strcpy` dengan fungsi aman berbatas ukuran seperti `snprintf`:

      ```c
      void process_input(const char *user_str) {
          char buffer[64];
          snprintf(buffer, sizeof(buffer), "%s", user_str);
          printf("Input: %s\\n", buffer);
      }
      ```

      Pilihan Tindakan:
      🛠️ [PERBAIKI] -> Terapkan snprintf dan validasi batas buffer.
      🙈 [ABAIKAN] -> Catat sebagai risiko memori yang belum di-patch.
